<script type="text/javascript">
RED.nodes.registerType('api-request', {
    category: 'webiq',
    color: '#C0DEED',
    defaults: {
        name: { value: "" },
        data: {
            value: `{
    "cmd": "io.read",
    "id": 0,
    "data": ["DSin", "SInt"]
}`
        },
        // Absent on nodes created before the typed input existed; those are JSON.
        dataType: { value: "json" }
    },
    inputs: 1,
    outputs: 1,
    icon: "envelope.svg",
    paletteLabel: "WebIQ request",
    label: function() { return this.name || "API Request"; },
    oneditprepare: function() {
        $("#node-input-data").typedInput({
            default: "json",
            typeField: "#node-input-dataType",
            types: ["json", "msg", "flow", "global", "env"]
        });
    }
});
</script>

<script type="text/html" data-template-name="api-request">
<div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
</div>
<div class="form-row">
    <label for="node-input-data"><i class="fa fa-code"></i> Data</label>
    <!-- typedInput needs a text input, not a textarea; it renders its own expanding
         JSON editor for the json type. Value comes from defaults.data. -->
    <input type="text" id="node-input-data" style="width:70%;">
    <input type="hidden" id="node-input-dataType">
</div>
<div class="form-tips">
    The request sent to the WebIQ server. Choose <b>JSON</b> to write it inline, or
    <b>msg</b> / <b>flow</b> / <b>global</b> / <b>env</b> to take it from elsewhere at
    runtime. However it is produced, it must contain <code>cmd</code>, <code>id</code>
    and <code>data</code>.
</div>
</script>

<script type="text/html" data-help-name="api-request">
<p>Builds a WebIQ request and forwards it to a <b>WebIQ API Connect</b> node.</p>

<h3>Data</h3>
<dl class="message-properties">
    <dt>json</dt>
    <dd>The request written inline. Parsed once when the node is deployed, so a
        syntax error shows on the canvas immediately rather than on the first
        message.</dd>

    <dt>msg / flow / global / env</dt>
    <dd>The request is read from that source for every message, so it can change at
        runtime. A JSON string is parsed automatically.</dd>
</dl>

<p>Whatever the source, the value must contain <code>cmd</code>, <code>id</code> and
   <code>data</code>. If it does not, the message fails with an error naming what is
   missing, and can be trapped with a <b>Catch</b> node.</p>
</script>
