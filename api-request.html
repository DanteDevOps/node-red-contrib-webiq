<script type="text/javascript">
RED.nodes.registerType('api-request', {
    category: 'webiq',
    color: '#C0DEED',
    defaults: {
        name: { value: "" },
        data: { 
            value: `{
    "cmd": "io.read",
    "id": 0,
    "data": ["DSin", "SInt"]
}`
        }
    },
    inputs: 1,
    outputs: 1,
    icon: "envelope.svg",
    label: function() { return this.name || "API Request"; }
});
</script>

<script type="text/html" data-template-name="api-request">
<div class="form-row">
    <label>Name</label>
    <input type="text" id="node-input-name" placeholder="Name">
</div>
<div class="form-row">
    <label>Data (full JSON payload)</label>
    <textarea id="node-input-data" style="width:100%; height:120px;">
{
    "cmd": "io.read",
    "id": 0,
    "data": ["DSin", "SInt"]
}
    </textarea>
</div>
</script>

<script type="text/html" data-help-name="api-request">

</script>
