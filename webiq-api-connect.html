<script type="text/javascript">
    RED.nodes.registerType('webiq-api-connect', {
        category: 'webiq',
        color: '#C0DEED',
        defaults: {
            name: { value: "" },
            host: { value: "" },
            port: { value: "" },
            project: { value: "" },
            secure: { value: false },
            tls: { value: "", type: "tls-config", required: false },
            loginTimeout: {
                value: 5,
                validate: function (v) {
                    // Must agree with the runtime clamp in webiq-api-connect.js:
                    // empty falls back to 5s, anything above 86400s is rejected here
                    // and clamped there.
                    if (v === "" || v === undefined) { return true; }
                    var n = Number(v);
                    return isFinite(n) && n > 0 && n <= 86400;
                }
            },
            heartbeat: {
                value: 30,
                validate: function (v) {
                    // 0 means "disabled"; anything else must be at least 1 second.
                    // A fractional value such as 0.001 would otherwise be honoured
                    // literally and produce hundreds of pings a second.
                    if (v === "" || v === undefined) { return true; }
                    var n = Number(v);
                    if (!isFinite(n)) { return false; }
                    return n === 0 || (n >= 1 && n <= 3600);
                }
            },
            loginAttempts: {
                value: 5,
                validate: function (v) {
                    // Must agree with the runtime clamp: 1..20, empty means 5.
                    if (v === "" || v === undefined) { return true; }
                    var n = Number(v);
                    return isFinite(n) && n >= 1 && n <= 20;
                }
            }
        },
        // Stored in Node-RED's credential store, not in flows.json, and stripped
        // from flow exports. The input ids stay node-input-<name>, which is how
        // the editor binds credential fields.
        credentials: {
            username: { type: "text" },
            password: { type: "password" }
        },
        inputs: 1,
        outputs: 1,
        icon: "bridge.svg",
        paletteLabel: "WebIQ connect",
        label: function () {
            return this.name || "WebIQ API Connect";
        },
        oneditprepare: function () {
            // Selecting a TLS configuration implies wss://, so keep the checkbox
            // and the config-node picker from contradicting each other.
            function syncTls() {
                var hasTlsConfig = $("#node-input-tls").val() &&
                    $("#node-input-tls").val() !== "_ADD_";
                if (hasTlsConfig) {
                    $("#node-input-secure").prop("checked", true);
                }
                $("#node-row-tls").toggle($("#node-input-secure").is(":checked"));
            }
            $("#node-input-secure").on("change", syncTls);
            $("#node-input-tls").on("change", syncTls);
            syncTls();
        }
    });
</script>

<script type="text/html" data-template-name="webiq-api-connect">
    <div class="form-row">
        <label for="node-input-name"><i class="fa fa-tag"></i> Name</label>
        <input type="text" id="node-input-name" placeholder="Name">
    </div>
    <div class="form-row">
        <label for="node-input-host"><i class="fa fa-globe"></i> Host</label>
        <input type="text" id="node-input-host" placeholder="Host">
    </div>
    <div class="form-row">
        <label for="node-input-port"><i class="fa fa-list-ol"></i> Port</label>
        <input type="number" id="node-input-port" placeholder="Port">
    </div>
    <div class="form-row">
        <label for="node-input-project"><i class="fa fa-folder"></i> Project</label>
        <input type="text" id="node-input-project" placeholder="Project">
    </div>
    <div class="form-row">
        <label for="node-input-secure"><i class="fa fa-lock"></i> Secure</label>
        <input type="checkbox" id="node-input-secure" style="width:auto; vertical-align:top;">
        <span>Connect with <code>wss://</code> (TLS)</span>
    </div>
    <div class="form-row" id="node-row-tls">
        <label for="node-input-tls"><i class="fa fa-certificate"></i> TLS config</label>
        <input type="text" id="node-input-tls">
    </div>
    <div class="form-row">
        <label for="node-input-username"><i class="fa fa-user"></i> Username</label>
        <input type="text" id="node-input-username" placeholder="Username">
    </div>
    <div class="form-row">
        <label for="node-input-password"><i class="fa fa-lock"></i> Password</label>
        <input type="password" id="node-input-password" placeholder="Password">
    </div>
    <div class="form-row">
        <label for="node-input-loginTimeout"><i class="fa fa-clock-o"></i> Login timeout</label>
        <input type="number" id="node-input-loginTimeout" min="0.1" max="86400" placeholder="5" style="width:100px;"> seconds
    </div>
    <div class="form-tips">
        Increase the login timeout if the WebIQ project is backed by a slow PLC and needs
        longer than the default 5 seconds to answer a login. Leave empty to use the default.
        Maximum 86400 (24 hours).
    </div>
    <div class="form-row">
        <label for="node-input-heartbeat"><i class="fa fa-heartbeat"></i> Heartbeat</label>
        <input type="number" id="node-input-heartbeat" min="0" max="3600" step="1" placeholder="30" style="width:100px;"> seconds
    </div>
    <div class="form-tips">
        How often to probe the connection once authenticated. Without this, a link that
        dies without a TCP close - a frozen server, a dropped NAT entry, a switch reboot -
        is undetectable: the node keeps reporting <b>authenticated</b> while every request
        disappears. Set <b>0</b> to disable.
    </div>
    <div class="form-row">
        <label for="node-input-loginAttempts"><i class="fa fa-ban"></i> Login attempts</label>
        <input type="number" id="node-input-loginAttempts" min="1" max="20" placeholder="5" style="width:100px;"> attempts
    </div>
    <div class="form-tips">
        How many rejected logins before the node stops and waits for you. WebIQ counts
        login attempts server-side and can lock the account - usually the same account
        the operator HMI uses - so retrying a wrong password forever is not harmless.
    </div>
</script>

<script type="text/html" data-help-name="webiq-api-connect">
    <p>This node connects to a WebIQ server over WebSocket, logs in with the configured
       credentials, and reconnects automatically if the connection drops.</p>
    <p>Wire an <b>API Request</b> node into this node's input to send commands. Every message
       received from the server is emitted on this node's output.</p>

    <h3>Settings</h3>
    <dl class="message-properties">
        <dt>Host <span class="property-type">string</span></dt>
        <dd>WebIQ server hostname, IP address, Docker container name, or an IPv6
            literal (bare or bracketed). This must be the host <i>only</i>: a scheme,
            path, query, whitespace, an embedded port, or userinfo (<code>@</code>)
            is rejected as <code>invalid host</code>. Userinfo in particular can make
            a host look like one server while connecting to another, which would send
            your credentials there.</dd>

        <dt>Port <span class="property-type">number</span></dt>
        <dd>WebIQ server port (for example <code>10123</code>).</dd>

        <dt>Project <span class="property-type">string</span></dt>
        <dd>WebIQ project name or UUID.</dd>

        <dt>Secure <span class="property-type">boolean</span></dt>
        <dd>Connect with <code>wss://</code> instead of <code>ws://</code>. Without it
            the login frame - and every value read from or written to the PLC - crosses
            the network in cleartext.</dd>

        <dt>TLS config <span class="property-type">tls-config</span></dt>
        <dd>Optional. Points at a standard Node-RED <b>tls-config</b> node for custom
            CAs, client certificates or a passphrase. Selecting one implies
            <b>Secure</b>. Certificate verification is controlled by that node's own
            <i>Verify server certificate</i> setting; this node never overrides it, so
            enabling TLS cannot silently fall back to an unverified connection.</dd>

        <dt>Username <span class="property-type">credential</span></dt>
        <dd>WebIQ project username. Stored in Node-RED's credential store, not in
            <code>flows.json</code>, and stripped from flow exports.</dd>

        <dt>Password <span class="property-type">credential</span></dt>
        <dd>WebIQ project password. Stored alongside the username in the credential
            store. Nodes created before 2.0 kept these two fields in the flow file in
            cleartext. There is deliberately no fallback to those old values: such a
            node reports <code>credentials need re-entry</code> and does not connect
            until you reopen it, type both values in again and redeploy.</dd>

        <dt>Login timeout <span class="property-type">number</span></dt>
        <dd>How many seconds to wait for the server's login reply before reporting
            <code>login timeout</code> and reconnecting. Defaults to <code>5</code>,
            maximum <code>86400</code> (24 hours). Raise this for projects backed by a
            slow PLC, which may need considerably longer to answer. Values above the
            maximum are clamped rather than accepted, because the underlying timer
            overflows past that point and would fire immediately.</dd>

        <dt>Heartbeat <span class="property-type">number</span></dt>
        <dd>Seconds between liveness probes, sent only once the connection is
            authenticated. Defaults to <code>30</code>; <code>0</code> disables it.
            The link is terminated and reconnected after two consecutive intervals with
            no pong <i>and</i> no other inbound traffic, so a server that is streaming
            data but ignores pings is never treated as dead. Without a heartbeat, a
            connection that drops without a TCP close stays <code>authenticated</code>
            indefinitely and never reconnects.</dd>

        <dt>Login attempts <span class="property-type">number</span></dt>
        <dd>How many consecutive <i>rejected</i> logins (default <code>5</code>,
            range 1&ndash;20) before the node latches: badge
            <code>login blocked - fix and redeploy</code>, no further attempts. WebIQ
            counts login attempts server-side and can lock the account, and a reply of
            "too many login attempts" latches immediately. Logins that go
            <i>unanswered</i> never latch - after the same count the node falls back to
            one probe every 60 seconds and recovers on its own when the server answers,
            so a server that is slow to boot cannot permanently strand the node.</dd>
    </dl>

    <h3>Recovering a blocked node</h3>
    <p>A latched node refuses messages with the reason. Either fix the credentials and
       redeploy, or send it a message with <code>msg.webiq = "reconnect"</code>: this
       grants <b>one</b> fresh login attempt, at most once per 60 seconds. Any
       <code>msg.payload</code> on the control message is <b>not</b> sent - the message
       fails with an error saying so, and the request must be re-sent once the node is
       authenticated.</p>
    <p>Connection-level failures (login rejected, link stale, upgrade rejected) are
       reported in the log and on the status badge; use a <b>Status</b> node to alarm on
       them. Errors tied to a message you sent - and any request the server answers with
       an error frame - are also routed to <b>Catch</b> nodes.</p>
</script>
